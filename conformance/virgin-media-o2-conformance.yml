published_security_requirements:
  document: Virgin Media O2 Security Schedule
  url: https://news.virginmediao2.co.uk/wp-content/uploads/2026/01/Virgin-Media-O2-Security-Schedule-Version-7.0-Jan-2026.pdf
  version_retrieved: Version 8.0 July 2026 (Public)
  retrieved: '2026-07-25'
  scope: >-
    Public, versioned document setting the minimum security standards third
    parties must meet when delivering services, equipment or software to Virgin
    Media O2. These are obligations Virgin Media O2 imposes on its supply chain
    and evidence of the regimes it operates under — they are NOT a Virgin Media
    O2 self-certification, and no Virgin Media O2 trust center or certificate
    listing was found (trust.virginmediao2.co.uk does not resolve).
  regimes:
  - id: iso-27001
    name: ISO/IEC 27001
    role: required-of-suppliers
    evidence: "\"The Supplier's information security will be compliant to ISO/IEC 27001. Evidence of…\" (section 3, Information Security)"
  - id: cyber-essentials
    name: Cyber Essentials / Cyber Essentials Plus
    role: required-of-suppliers
    evidence: Suppliers must maintain an up-to-date Cyber Essentials Certification or an accepted equivalent for the duration of any service.
  - id: pci-dss
    name: PCI DSS
    role: required-of-suppliers
    evidence: Appendix A, section 1.0 — Payment Card Industry Data Security Standard requirements for services processing cardholder data.
  - id: sarbanes-oxley
    name: Sarbanes-Oxley (SEC section 404)
    role: required-of-suppliers
    evidence: Appendix A, section 2.0 — Sarbanes Oxley Compliance.
  - id: nis-regulations-2018
    name: UK Network and Information Systems Regulations 2018
    role: applicable-law
    evidence: Appendix A, section 3.0 — Network and Information Systems Regulations (NIS) 2018.
  - id: uk-telecommunications-security-act
    name: UK Telecommunications (Security) Act / TSA
    role: applicable-law
    evidence: Appendix B — Telecommunications Security, with measures for TSA suppliers, network equipment vendors, SIM card suppliers and CPE vendors.
  - id: cvss-3x
    name: CVSS v3.x
    role: required-of-suppliers
    evidence: Vulnerability Management section mandates CVSS v3.x severity scoring with response times banded Critical (9.0-10), High (7.0-8.9) and Other (below 6.9).
  - id: vulnerability-disclosure-policy
    name: Supplier vulnerability disclosure policy
    role: required-of-suppliers
    evidence: >-
      "The Supplier shall have in place a vulnerability disclosure policy that
      includes, at a minimum, ..." — Virgin Media O2 requires a VDP of its
      suppliers while publishing no security.txt or disclosure page of its own.
