      Virgin Media O2's UK network.
  - url: https://api.github.com/orgs/VirginMediaO2
    type: GitHubOrganization
    status: 200
    note: Organization exists, 0 public repositories.
  - url: https://github.com/camaraproject
    type: Standards
    status: 200
    note: Upstream publisher of the KYC Age Verification, KYC Match, SIM Swap and
      Tenure specifications that Virgin Media O2 implements.
