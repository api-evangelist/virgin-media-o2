apis:
- aid: virgin-media-o2:newsroom-content-api
  name: Virgin Media O2 Newsroom Content API (WordPress REST)
  description: >-
    The anonymous read surface of the Virgin Media O2 press newsroom, served by
    WordPress at news.virginmediao2.co.uk/wp-json/. It is the only callable,
    self-describing API Virgin Media O2 serves on a host it controls: the route
    index advertises 253 routes, and each wp/v2 collection returns its own
    draft-04 JSON Schema in the OPTIONS response. It is a content API for press
    releases, not a Virgin Media O2 product or network API — the CAMARA network
    APIs Virgin Media O2 launched commercially are specified upstream and reached
    only through third-party aggregators. Read routes are open; write routes
    require authentication. No OpenAPI is published for it.
  humanURL: https://news.virginmediao2.co.uk/news-views/
  baseURL: https://news.virginmediao2.co.uk/wp-json/
  tags:
  - Content
  - Newsroom
  - WordPress
  - Press Releases
